[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moondrop-dawn-pro"
version = "1.0.0"
description = "Userspace driver exposing volume, gain, filter and LED settings of the MOONDROP Dawn Pro USB DAC"
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "winsdk>=1.0", "pycaw>=20240210", "comtypes>=1.2"]

[project.scripts]
moondrop = "moondrop.cli:main"

[project.gui-scripts]
moondrop-gui = "moondrop.gui:main"

[tool.setuptools]
packages = ["moondrop", "moondrop.ui"]

[tool.setuptools.package-data]
"moondrop.ui" = ["qml/*.qml", "assets/*"]
